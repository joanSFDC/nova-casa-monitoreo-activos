<template>
  <div class="monitor">
    <div aria-live="polite" class="slds-assistive-text">{anuncio}</div>

    <template lwc:if={cargando}>
      <div class="tarjeta">
        <div class="slds-text-heading_small slds-m-bottom_small">
          Cargando el monitor
        </div>
        <div class="slds-skeleton slds-skeleton_text"></div>
        <div class="slds-skeleton slds-skeleton_text slds-m-top_small"></div>
        <div class="slds-skeleton slds-skeleton_text slds-m-top_small"></div>
      </div>
    </template>

    <template lwc:elseif={error}>
      <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
        <h2 class="slds-text-heading_small">No se pudo cargar el monitor</h2>
        <p>{error}</p>
        <template lwc:if={errorEsPermiso}>
          <p>
            No tienes permiso para ver estos equipos. Habla con tu coordinador.
          </p>
        </template>
        <template lwc:else>
          <lightning-button
            class="slds-m-top_small"
            variant="neutral"
            label="Reintentar"
            onclick={handleReintentar}
          ></lightning-button>
        </template>
      </div>
    </template>

    <template lwc:elseif={panel}>
      <template lwc:if={panel.consultaAtrasada}>
        <div
          class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small"
          role="status"
        >
          La última consulta al proveedor se atrasó. Los datos de la tabla
          pueden no estar al día.
        </div>
      </template>

      <div class="tarjeta">
        <div class="cabecera">
          <div>
            <h1 class="titulo">Monitor de activos</h1>
            <template lwc:if={tiempoRealCaido}>
              <p class="aviso-tiempo-real">
                La actualización automática no está disponible. El monitor se
                revisa solo cada minuto y con «Actualizar».
              </p>
            </template>
          </div>
          <div class="acciones-cabecera">
            <button
              type="button"
              class="slds-button slds-button_neutral pulso"
              aria-pressed={pulsoPresionado}
              onclick={handlePulso}
            >
              {textoPulso}
            </button>
            <lightning-button
              variant="neutral"
              label="Actualizar"
              icon-name="utility:refresh"
              onclick={handleActualizar}
              disabled={actualizando}
            ></lightning-button>
          </div>
        </div>

        <div class="barra">
          <div class="fichas" role="toolbar" aria-label="Filtrar por severidad">
            <template for:each={fichas} for:item="ficha">
              <button
                key={ficha.valor}
                type="button"
                class={ficha.clase}
                data-severidad={ficha.valor}
                aria-pressed={ficha.pulsada}
                onclick={handleFiltro}
              >
                <span class="ficha-punto" aria-hidden="true"></span>
                <span>{ficha.etiqueta}</span>
              </button>
            </template>
          </div>
          <div class="controles">
            <template lwc:if={mostrarSelectorEdificio}>
              <lightning-combobox
                class="control control_edificio"
                name="edificio"
                label="Edificio"
                value={edificioId}
                options={opcionesEdificio}
                onchange={handleEdificio}
              ></lightning-combobox>
            </template>
            <lightning-combobox
              class="control control_tipo"
              name="tipo"
              label="Tipo de equipo"
              value={filtroTipo}
              options={opcionesTipo}
              onchange={handleTipo}
            ></lightning-combobox>
            <lightning-combobox
              class="control control_orden"
              name="orden"
              label="Ordenar por"
              value={orden}
              options={opcionesOrden}
              onchange={handleOrden}
            ></lightning-combobox>
            <lightning-input
              class="control control_busqueda"
              type="search"
              name="busqueda"
              label="Buscar equipo"
              placeholder="Nombre o código"
              value={busqueda}
              onchange={handleBusqueda}
            ></lightning-input>
          </div>
        </div>

        <template lwc:if={panel.sinEdificios}>
          <p class="vacio">
            No tienes edificios asignados. Habla con tu coordinador para que te
            dé acceso.
          </p>
        </template>
        <template lwc:elseif={panel.sinLecturas}>
          <p class="vacio">Tus equipos no tienen lecturas todavía.</p>
        </template>
        <template lwc:elseif={sinResultadosDeFiltro}>
          <div class="vacio">
            <p>Ningún equipo coincide con los filtros.</p>
            <lightning-button
              variant="base"
              label="Quitar filtros"
              onclick={handleQuitarFiltros}
            ></lightning-button>
          </div>
        </template>
        <template lwc:else>
          <div class="slds-scrollable_x">
            <table class="tabla">
              <caption class="slds-assistive-text">
                Equipos por edificio, con su lectura, medición, severidad y
                antigüedad
              </caption>
              <thead>
                <tr>
                  <th scope="col">Equipo</th>
                  <th scope="col">Lectura</th>
                  <th scope="col">Severidad</th>
                  <th scope="col">Antigüedad</th>
                  <th scope="col">
                    <span class="slds-assistive-text">Acción</span>
                  </th>
                </tr>
              </thead>
              <template for:each={grupos} for:item="grupo">
                <tbody key={grupo.id}>
                  <tr class="fila-grupo">
                    <th scope="rowgroup" colspan="5">
                      <span class="grupo-nombre">{grupo.nombre}</span>
                      <template lwc:if={grupo.ciudad}>
                        <span class="grupo-ciudad">{grupo.ciudad}</span>
                      </template>
                      <span class="grupo-resumen">{grupo.resumen}</span>
                    </th>
                  </tr>
                  <template for:each={grupo.filas} for:item="fila">
                    <tr key={fila.estadoId} class={fila.claseFila}>
                      <th scope="row" class="celda-equipo">
                        <div class="equipo">
                          <c-icono-equipo
                            tipo={fila.tipoActivo}
                          ></c-icono-equipo>
                          <div class="equipo-texto">
                            <button
                              type="button"
                              class="slds-button slds-button_reset slds-text-link equipo-nombre"
                              data-id={fila.activoId}
                              onclick={handleActivo}
                            >
                              {fila.equipo}
                            </button>
                            <span class="equipo-detalle">
                              {fila.detalleEquipo}
                            </span>
                          </div>
                        </div>
                      </th>
                      <td class="celda-lectura">
                        <template lwc:if={fila.esCamara}>
                          <span class={fila.claseComunicacion}>
                            <span
                              class="comunicacion-punto"
                              aria-hidden="true"
                            ></span>
                            {fila.textoLectura}
                          </span>
                        </template>
                        <template lwc:else>
                          <span class="valor">{fila.textoLectura}</span>
                        </template>
                        <span class="lectura-medicion">{fila.medicion}</span>
                      </td>
                      <td>
                        <div class="severidad">
                          <c-pastilla-severidad
                            severidad={fila.severidad}
                            etiqueta={fila.severidadEtiqueta}
                          ></c-pastilla-severidad>
                          <template lwc:if={fila.casoNormalizado}>
                            <span
                              class="insignia-normalizado"
                              title="El equipo volvió a lo normal. El caso sigue abierto hasta que coordinación lo verifique y lo cierre."
                            >
                              Normalizado · caso abierto
                            </span>
                          </template>
                        </div>
                      </td>
                      <td class="antiguedad">{fila.antiguedad}</td>
                      <td class="celda-accion">
                        <template lwc:if={fila.puedeIntervenir}>
                          <lightning-button
                            variant="neutral"
                            data-estado={fila.estadoId}
                            data-caso={fila.casoId}
                            label={fila.etiquetaAccion}
                            title={fila.tituloAccion}
                            onclick={handleAccion}
                          ></lightning-button>
                        </template>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </template>
            </table>
          </div>
        </template>
      </div>
    </template>
  </div>
</template>
